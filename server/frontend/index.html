<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Whiteboard Game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="joinScreen">
  <div id="joinBox">
    <h1>⚔️ DrawDuel ⚔️</h1>

    <input id="nameInput" placeholder="Enter your name" />

    <input id="roomInput" placeholder="Enter room ID" />

    <button id="joinBtn">Join Room</button>
  </div>
</div>
<!-- Top Bar -->
<header id="topbar">
  <div class="brand">⚔️ DrawDuel ⚔️</div>

  <div id="hintBox"></div>

  <div id="timer"></div>

  <button id="startBtn">Start Game</button>
</header>
<!-- Main Layout -->
<div id="app">
<!-- Left Panel -->
<aside id="leftPanel">
<div class="card">
  <h3>Status</h3>
  <div id="statusBox"></div>
</div>
<div class="card">
<h3>Leaderboard</h3> 
<div id="leaderboard"></div>
</div>
<button id="clearBtn">Clear Board</button>
</aside>
<!-- Center Canvas -->
<main id="centerPanel">
  <div id="wordOverlay" class="hidden">
    <div id="wordBox">
      <h2>Choose a word</h2>
      <div id="wordChoices"></div>
    </div>
  </div>
  <div id="gameOverOverlay" class="hidden">
  <div id="gameOverBox">
    <h1>🏆 Game Over</h1>

    <div id="finalScores"></div>

    <button id="restartBtn">Play Again</button>
  </div>
</div>

  <div id="canvasWrapper">
  <canvas id="board"></canvas>

  <div id="toolbar">
    <div id="colors">
      <button class="colorBtn active" data-color="#000000" style="background:#000000;"></button>
      <button class="colorBtn" data-color="#ff0000" style="background:#ff0000;"></button>
      <button class="colorBtn" data-color="#2196f3" style="background:#2196f3;"></button>
      <button class="colorBtn" data-color="#4caf50" style="background:#4caf50;"></button>
      <button class="colorBtn" data-color="#ffeb3b" style="background:#ffeb3b;"></button>
      <button class="colorBtn" data-color="#9c27b0" style="background:#9c27b0;"></button>
      <button class="colorBtn" data-color="#ffffff" style="background:#ffffff; border:2px solid #999;"></button>
    </div>

    <div id="sizes">
      <button class="sizeBtn active" data-size="3">S</button>
      <button class="sizeBtn" data-size="6">M</button>
      <button class="sizeBtn" data-size="10">L</button>
    </div>
  </div>
</div>
</main>
<!-- Right Panel -->
<!-- Right Panel -->
<aside id="rightPanel">
  <div class="card">
    <h3>Chat</h3>
    <div id="chatBox"></div>
    <div id="chatControls">
      <input id="chatInput" placeholder="Type guess..." />
    </div>
  </div>
</aside>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
