<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Whiteboard Game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Top Bar -->
<header id="topbar">
  <div class="brand">⚔️ DrawDuel ⚔️</div>

  <div id="hintBox">Waiting...</div>

  <div id="timer">120</div>

  <button id="startBtn">Start Game</button>
</header>
<!-- Main Layout -->
<div id="app">
<!-- Left Panel -->
<aside id="leftPanel">
<div class="card">
  <h3>Status</h3>
  <div id="statusBox"></div>
</div>
<div class="card">
<h3>Leaderboard</h3> 
<div id="leaderboard"></div>
</div>
<button id="clearBtn">Clear Board</button>
</aside>
<!-- Center Canvas -->
<main id="centerPanel">
  <div id="wordOverlay" class="hidden">
    <div id="wordBox">
      <h2>Choose a word</h2>
      <div id="wordChoices"></div>
    </div>
  </div>
  <div id="gameOverOverlay" class="hidden">
  <div id="gameOverBox">
    <h1>🏆 Game Over</h1>

    <div id="finalScores"></div>

    <button id="restartBtn">Play Again</button>
  </div>
</div>

  <canvas id="board"></canvas>
</main>
<!-- Right Panel -->
<!-- Right Panel -->
<aside id="rightPanel">
  <div class="card">
    <h3>Chat</h3>
    <div id="chatBox"></div>
    <div id="chatControls">
      <input id="chatInput" placeholder="Type guess..." />
    </div>
  </div>
</aside>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
